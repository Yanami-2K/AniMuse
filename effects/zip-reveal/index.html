<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zip Reveal · AniMuse</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage" id="stage">
    <svg class="scene" id="scene" viewBox="0 0 400 300" aria-labelledby="ttl">
      <title id="ttl" data-en="A canvas pouch with a zipper. Unzip it to reveal the coupon inside.">一个帆布收纳袋，拉开拉链，里面藏着一张优惠券</title>
      <defs>
        <clipPath id="catClip"><path id="catClipPath" d="M0 0Z"/></clipPath>
        <pattern id="stripe" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><rect width="1" height="6" fill="#111" opacity=".35"/></pattern>
      </defs>
      <path class="floor" d="M56 264.5 H344"/>
      <path class="back k" d="M80 176 L80 102 Q80 84 98 84 L302 84 Q320 84 320 102 L320 176 Z"/>
      <path class="lens" id="lens" d="M0 0Z"/>
      <path class="lining" id="lining" d="M0 0Z"/>
      <path class="tape" id="tapeU" d="M0 0Z"/>
      <g id="teethU"></g>
      <g clip-path="url(#catClip)">
        <g id="cat">
          <g id="catInner">
            <g class="ticket">
              <path class="tk" d="M-54 -76 H54 V-30 A6 6 0 0 0 54 -18 V0 H-54 V-18 A6 6 0 0 0 -54 -30 Z"/>
              <text class="tkS" x="-44" y="-60">COUPON</text><text class="tkS" x="44" y="-60" text-anchor="end">N°01</text>
              <text class="tkB" x="0" y="-34" text-anchor="middle">−25%</text>
              <path class="tkD" d="M-44 -24 H44"/>
              <text class="tkS" x="0" y="-9" text-anchor="middle">ANIMUSE-25</text>
            </g>
          </g>
        </g>
      </g>
      <path class="front k" id="front" d="M0 0Z"/>
      <path class="stitch" d="M90 152 L90 226 Q90 254 118 254 L282 254 Q310 254 310 226 L310 152"/>
      <text class="label" x="102" y="244">CANVAS POUCH — 208 MM</text>
      <text class="label" x="298" y="244" text-anchor="end">N°01</text>
      <path class="tape" id="tapeL" d="M0 0Z"/>
      <g id="teethL"></g>
      <g id="paws"></g>
      <g id="pull" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="拉链" data-en-label="Zipper">
        <circle class="ring" id="ring" r="22"/>
        <rect class="slider k" id="slider" x="-12" y="-8" width="24" height="16" rx="5"/>
        <g id="tab"><rect class="tabK k" x="-6.5" y="-1" width="13" height="32" rx="6.5"/><circle class="tabHole" cx="0" cy="23" r="3.2"/><circle class="k pin" cx="0" cy="1" r="2.6"/></g>
        <rect class="hit" x="-20" y="-14" width="40" height="56"/>
      </g>
      <g id="bubble" class="bubble">
        <path class="k" id="bubbleBox" d="M0 0Z"/>
        <text id="bubbleTxt" x="0" y="0" text-anchor="middle" data-en="Coupon unlocked">优惠券已解锁</text>
      </g>
    </svg>
    <p class="hint" data-en="Drag the zipper pull · ← → or Space">拖动拉链头 · ← → 或空格</p>
    <p class="sr" id="live" aria-live="polite"></p>
  </main>
  <i class="finger" id="finger" aria-hidden="true"></i>
  <script src="script.js"></script>
</body>
</html>
