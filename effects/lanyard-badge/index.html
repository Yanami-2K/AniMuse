<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lanyard Badge · AniMuse</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="rope" aria-hidden="true"></canvas>
  <i class="nail" id="nail" aria-hidden="true"></i>
  <div class="badge" id="badge" role="img" aria-label="挂在绳子上的工牌，可以拖着甩" data-en-label="A badge on a lanyard you can drag and swing">
    <div class="face">
      <i class="clip"></i>
      <div class="band"><span>STAFF</span><i class="slot"></i><span>2026</span></div>
      <div class="avatar">
        <svg viewBox="0 0 200 200"><path d="M58 172 L58 96 L66 58 L84 76 Q100 70 116 76 L134 58 L142 96 L142 172 Q131 162 121 174 Q110 162 100 174 Q90 162 79 174 Q69 162 58 172Z" fill="#e9e3ff" stroke="#1c1a21" stroke-width="7" stroke-linejoin="round"/><ellipse cx="84" cy="116" rx="7" ry="9" fill="#1c1a21"/><ellipse cx="116" cy="116" rx="7" ry="9" fill="#1c1a21"/><circle cx="72" cy="134" r="7" fill="#ff9db5"/><circle cx="128" cy="134" r="7" fill="#ff9db5"/></svg>
      </div>
      <b>AniMuse</b>
      <small data-en="Motion Intern">动效实习生 · Motion Intern</small>
      <div class="bar"><i></i><span>ID 0007</span></div>
      <i class="sheen" id="sheen"></i>
    </div>
  </div>
  <i class="finger" id="finger" aria-hidden="true"></i>
  <script src="script.js"></script>
</body>
</html>
