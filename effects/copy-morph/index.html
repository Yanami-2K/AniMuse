<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Copy Button Morph · AniMuse</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <button class="copy" id="copy" type="button" data-text="帮我做一个会呼吸的按钮">
    <span class="ico" aria-hidden="true">
      <svg class="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
      <svg class="i-ok" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></svg>
    </span>
    <span class="lbl" id="lbl"><span class="a">复制 Prompt</span><span class="b">已复制，去粘贴吧</span></span>
  </button>
  <script src="script.js"></script>
</body>
</html>
