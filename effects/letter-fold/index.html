<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fold &amp; Send Letter · AniMuse</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <template id="sheetTpl">
    <div class="sheet">
      <p class="hi" data-en="Hi designer,">Hi 设计同学，</p>
      <svg class="hand" viewBox="0 0 200 92" preserveAspectRatio="none" aria-hidden="true">
        <path d="M4 10 q8 -6 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t12 0"/>
        <path d="M4 34 q8 -6 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t8 0"/>
        <path d="M4 58 q8 -6 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0"/>
        <path d="M4 82 q8 -6 16 0 t16 0 t16 0 t16 0 t16 0 t10 0"/>
      </svg>
      <p class="sign" data-en="— Lin">—— 小林</p>
      <i class="air">AIR<br>MAIL</i>
    </div>
  </template>
  <div class="stage" id="stage">
    <div class="fly" id="fly">
      <i class="env-back" id="eb"></i>
      <div class="letter" id="letter">
        <div class="p top" id="pt"><div class="face front"></div><div class="face back"><p class="to" data-en="<small>TO</small>The designer"><small>TO</small>设计同学</p><i class="stamp">8¢</i></div><i class="shade"></i></div>
        <div class="p mid"><div class="face front"></div></div>
        <div class="p bot" id="pb"><div class="face front"></div><div class="face back"></div><i class="shade"></i></div>
      </div>
      <svg class="pocket" id="pk" viewBox="0 0 140 86" aria-hidden="true">
        <defs><pattern id="air" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="var(--env)"/><rect width="5" height="14" fill="var(--red)"/><rect x="7" width="5" height="14" fill="var(--blue)"/></pattern></defs>
        <path d="M2 14 L70 54 L138 14 V80 Q138 84 134 84 H6 Q2 84 2 80 Z" fill="url(#air)"/>
        <path d="M2 14 L70 54 L138 14 L133.5 19 V79.5 H6.5 V19 Z" fill="var(--env)"/>
        <path d="M2 14 L70 54 L138 14 V80 Q138 84 134 84 H6 Q2 84 2 80 Z" fill="none" stroke="var(--ink)" stroke-width="1.4" stroke-linejoin="round"/>
      </svg>
      <svg class="flap" id="fp" viewBox="0 0 140 56" aria-hidden="true"><path d="M2 1.5 H138 L75 51 Q70 55 65 51 Z" fill="var(--env)" stroke="var(--ink)" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 4 H132 L72 49" fill="none" stroke="rgba(28,26,33,.08)" stroke-width="3"/></svg>
      <i class="seal" id="seal"><b>A</b></i>
    </div>
    <p class="sent" id="sent" data-en="Sent ✓">已寄出 ✓</p>
  </div>
  <script src="script.js"></script>
</body>
</html>
