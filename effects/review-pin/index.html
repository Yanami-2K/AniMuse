<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review Pin Drop · AniMuse</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page" id="page">
    <p class="kicker">首页 · 第二屏</p>
    <p class="copy">我们帮你把需求拆成小步，<mark id="hl">每一步都交给另一个 Agent 审一遍</mark>，测试全部通过才交付。</p>
    <span class="pin" id="pin" aria-hidden="true"><b>1</b></span>
    <div class="note" id="note"><span class="av">小</span><p>「审一遍」太口语，改成「独立 Code Review」</p></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
