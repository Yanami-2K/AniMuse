<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Press Type · AniMuse</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage" id="stage">
    <h1 class="sr" id="said"></h1>
    <div class="machine" id="machine">
      <div class="beam" aria-hidden="true"><b>PRESS-O-MATIC</b></div>
      <div class="row" id="row" role="group"></div>
      <div class="belt" aria-hidden="true"></div>
      <div class="legs" aria-hidden="true"><i></i><i></i></div>
    </div>
    <form class="retype" id="form" autocomplete="off">
      <input id="word" maxlength="8" spellcheck="false" placeholder="换个词试试" data-en-ph="Type a word" aria-label="要压出来的字" data-en-label="Word to press">
      <button type="submit" data-en="Press!">压！</button>
    </form>
  </main>
  <template id="catT">
    <svg class="cat" viewBox="48 46 104 128" aria-hidden="true">
      <path class="shell" d="M58 166 L58 96 L66 58 L84 78 Q100 72 116 78 L134 58 L142 96 L142 166 Q131 156 121 168 Q110 156 100 168 Q90 156 79 168 Q69 156 58 166Z"/>
      <path class="ear" d="M68 70 L80 82 L64 86Z M132 70 L120 82 L136 86Z"/>
      <g class="n"><ellipse class="eye" cx="84" cy="114" rx="7" ry="9"/><ellipse class="eye" cx="116" cy="114" rx="7" ry="9"/></g>
      <path class="line x" d="M77 107 L89 114 L77 121 M123 107 L111 114 L123 121"/>
      <path class="line h" d="M76 117 Q84 106 92 117 M108 117 Q116 106 124 117"/>
      <ellipse class="blush" cx="70" cy="131" rx="8" ry="5.5"/><ellipse class="blush" cx="130" cy="131" rx="8" ry="5.5"/>
      <path class="line" d="M91 129 Q95.5 135 100 129 Q104.5 135 109 129"/>
    </svg>
  </template>
  <script src="script.js"></script>
</body>
</html>
