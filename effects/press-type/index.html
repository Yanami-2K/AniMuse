<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Press Type · AniMuse</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage" id="stage">
    <h1 class="sr" id="said"></h1>
    <div class="machine" id="machine">
      <div class="beam" aria-hidden="true"><b>PRESS · 01</b></div>
      <div class="row" id="row" role="group"></div>
      <div class="belt" aria-hidden="true"></div>
      <div class="legs" aria-hidden="true"><i></i><i></i></div>
    </div>
    <form class="retype" id="form" autocomplete="off">
      <input id="word" maxlength="8" spellcheck="false" placeholder="换个词试试" data-en-ph="Type a word" aria-label="要压出来的字" data-en-label="Word to press">
      <button type="submit" data-en="Press!">压！</button>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
