<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phantom Results · AniMuse</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 灵感来自 Persona 5 的战斗结算画面。所有图形、角色、代码均为 AniMuse 原创，未使用任何 Atlus 素材 / 字体 / 截图 -->
  <main class="scene" id="scene" tabindex="0" aria-label="结算">
    <i class="band" id="band" aria-hidden="true"></i>
    <h1 class="ransom" id="title" aria-label="Results"></h1>
    <div class="stats">
      <p class="row" id="r1"><span class="k">EXP</span><b class="v" id="exp">0</b></p>
      <p class="row" id="r2"><span class="k" id="coinK">COIN</span><b class="v" id="coin">0</b></p>
      <div class="lv" id="lvRow"><span class="k">LV <b id="lv">23</b></span><span class="bar"><i id="fill"></i></span></div>
      <p class="stamp" id="stamp" aria-hidden="true">LEVEL UP!</p>
    </div>
    <ul class="items" id="items"></ul>
    <i class="catbg" id="catbg" aria-hidden="true"></i>
    <svg class="cat" id="cat" viewBox="0 0 200 200" aria-hidden="true">
      <g class="body" id="catBody">
        <path class="o" fill="#fff" d="M58 178 L58 92 L66 56 L84 76 Q100 70 116 76 L134 56 L142 92 L142 178Z"/>
        <path class="o" fill="#111" d="M59 138 Q78 144 91 142 L100 157 L109 142 Q122 144 141 138 L142 178 L58 178 Z"/>
        <path class="o" fill="#e5191c" d="M100 144 l-12 -7 0 14z M100 144 l12 -7 0 14z"/>
        <path class="o" fill-rule="evenodd" fill="#111" d="M58 100 Q66 92 84 96 Q100 101 116 96 Q134 92 142 100 L155 89 Q153 113 136 119 Q118 124 100 116 Q82 124 64 119 Q47 113 45 89 Z M74 109 a10 8.5 0 1 0 20 0 a10 8.5 0 1 0 -20 0 Z M106 109 a10 8.5 0 1 0 20 0 a10 8.5 0 1 0 -20 0 Z"/>
        <path class="o" fill="none" d="M77 111 Q84 104 91 111 M109 111 Q116 104 123 111"/>
        <path class="o" fill="#e5191c" d="M90 127 Q101 140 112 126 Z"/>
        <g id="hat"><rect class="o" x="85" y="36" width="30" height="30" rx="2" fill="#111"/><rect x="87" y="55" width="26" height="6" fill="#e5191c"/><rect class="o" x="74" y="64" width="52" height="8" rx="2" fill="#111"/></g>
      </g>
      <g id="paw"><path class="o" fill="#fff" d="M136 150 C142 128 148 112 152 100 L170 106 C166 120 158 138 152 156 Z"/><path class="o" fill="#fff" d="M148 104 C146 90 152 80 162 80 C173 80 178 90 175 104 Z"/><path class="o" fill="none" d="M156 82 V90 M164 81 V89"/></g>
    </svg>
    <button class="replay" id="replay" type="button">REPLAY</button>
    <p class="hint" id="hint">点击 / 空格 跳过</p>
  </main>
  <i class="slash" id="slash" aria-hidden="true"></i>
  <script src="script.js"></script>
</body>
</html>
