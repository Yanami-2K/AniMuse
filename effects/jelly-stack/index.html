<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jelly Card Stack · AniMuse</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="deck" id="deck">
    <article class="card c1"><small>NO.01</small><b>灵感<br>会跑</b><i class="shape s-circle"></i><em>拖走我 →</em></article>
    <article class="card c2"><small>NO.02</small><b>手感<br>要软</b><i class="shape s-blob"></i><em>甩出去</em></article>
    <article class="card c3"><small>NO.03</small><b>弹簧<br>不骗人</b><i class="shape s-tri"></i><em>放手会回来</em></article>
    <article class="card c4"><small>NO.04</small><b>再来<br>一张</b><i class="shape s-ring"></i><em>永远甩不完</em></article>
  </div>
  <i class="finger" id="finger" aria-hidden="true"></i>
  <script src="script.js"></script>
</body>
</html>
