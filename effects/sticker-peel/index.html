<title>Sticker Peel · AniMuse</title>

<body>
  <main class="stage" id="stage">

      <header><b>SHIP IT</b><small>STICKER PACK · 04</small></header>
      <i class="hole"></i>
    </section>
    <section class="lid" id="lid" aria-label="笔记本盖子" data-en-label="Laptop lid"><i class="cam"></i><i class="logo"></i></section>
    <i class="base"></i>
    <div id="slots"></div>
    <div id="stickers"></div>
    <div id="fx"></div>
  </main>
  <i class="finger" id="finger" aria-hidden="true"></i>
