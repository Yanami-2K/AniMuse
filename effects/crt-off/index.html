<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRT Power Off · AniMuse</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="set">
    <i class="ant l"></i><i class="ant r"></i>
    <div class="tv">
      <div class="bezel">
        <div class="screen" id="screen">
          <div class="content" id="content">
            <p class="t">build #128</p>
            <p class="big" data-en="Deployed">部署完成</p>
            <p class="s" data-en="3 services live · 42s">3 个服务已上线 · 用时 42s</p>
          </div>
          <canvas class="snow" id="snow" width="96" height="72" aria-hidden="true"></canvas>
          <i class="dot" id="dot" aria-hidden="true"></i>
          <i class="glass" aria-hidden="true"></i>
        </div>
      </div>
      <div class="panel">
        <button class="knob" id="knob" type="button" aria-label="开关" data-en-label="Power"><i></i></button>
        <i class="knob small"><i></i></i>
        <i class="grille"></i>
        <span class="led" id="led"></span>
      </div>
    </div>
    <i class="foot l"></i><i class="foot r"></i>
  </div>
  <script src="script.js"></script>
</body>
</html>
