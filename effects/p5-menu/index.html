<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phantom Menu · AniMuse</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 灵感来自 Persona 5 的 UI 语言（斜切、红黑白、剪报字）。所有图形、角色、代码均为 AniMuse 原创，未使用任何 Atlus 素材 / 字体 / 截图 -->
  <main class="scene" id="scene">
    <i class="slab" aria-hidden="true"></i><i class="stripes" aria-hidden="true"></i>
    <h1 class="ransom" id="title" aria-label="Menu"></h1>
    <ul class="menu" id="menu" role="menu"></ul>
    <svg class="cat" id="cat" viewBox="0 0 200 200" aria-hidden="true">
      <g class="body" id="catBody">
        <path class="o" fill="#fff" d="M58 178 L58 92 L66 56 L84 76 Q100 70 116 76 L134 56 L142 92 L142 178Z"/>
        <path class="o" fill="#111" d="M59 138 Q78 144 91 142 L100 157 L109 142 Q122 144 141 138 L142 178 L58 178 Z"/>
        <path class="o" fill="#e5191c" d="M100 144 l-12 -7 0 14z M100 144 l12 -7 0 14z"/>
        <path class="o" fill-rule="evenodd" fill="#111" d="M58 100 Q66 92 84 96 Q100 101 116 96 Q134 92 142 100 L155 89 Q153 113 136 119 Q118 124 100 116 Q82 124 64 119 Q47 113 45 89 Z M74 109 a10 8.5 0 1 0 20 0 a10 8.5 0 1 0 -20 0 Z M106 109 a10 8.5 0 1 0 20 0 a10 8.5 0 1 0 -20 0 Z"/>
        <g id="eyes"><ellipse cx="84" cy="110" rx="4.5" ry="6"/><ellipse cx="116" cy="110" rx="4.5" ry="6"/></g>
        <path id="mouth" class="o" fill="none" d="M92 129 Q101 136 110 127"/>
        <g id="hat"><rect class="o" x="85" y="36" width="30" height="30" rx="2" fill="#111"/><rect x="87" y="55" width="26" height="6" fill="#e5191c"/><rect class="o" x="74" y="64" width="52" height="8" rx="2" fill="#111"/></g>
      </g>
      <g id="paw"><path class="o" fill="#fff" d="M142 150 L168 112 L178 120 L152 158 Z"/><circle class="o" cx="174" cy="112" r="10" fill="#fff"/></g>
    </svg>
    <section class="panel" id="panel" aria-live="polite" hidden>
      <p class="pk" id="pk"></p>
      <h2 id="ph"></h2>
      <ul id="pl"></ul>
      <p class="esc"><b>ESC</b> <span id="back">返回</span></p>
    </section>
    <i class="wipe w1" id="w1" aria-hidden="true"></i><i class="wipe w2" id="w2" aria-hidden="true"></i>
  </main>
  <script src="script.js"></script>
</body>
</html>
